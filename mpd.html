<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barto TV - MPD Player</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0057b8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; width: 100%; height: 100%; overflow: hidden; }
        video { width: 100%; height: 100%; display: block; }
        .back-btn:focus { outline: 3px solid #ffc107; transform: scale(1.2); background: rgba(255,193,7,0.3); }
        .back-btn {
            position: fixed; bottom: 12px; left: 12px; z-index: 1000;
            background: rgba(0,0,0,0.7); color: #fff; width: 50px; height: 50px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            text-decoration: none; border: 2px solid #ffc107; font-size: 1.3rem; cursor: pointer;
        }
        #error-msg {
            display: none; position: absolute; inset: 0;
            align-items: center; justify-content: center; flex-direction: column;
            color: #ffc107; font-family: sans-serif; gap: 12px;
        }
        #error-msg.show { display: flex; }
    </style>
</head>
<body>

    <script> const HOME_URL = new URL('./', window.location.href).href; </script>

    <button id="back-btn" class="back-btn" autofocus aria-label="Volver a la lista de canales">⬅</button>
    <video id="video" autoplay controls playsinline></video>
    <div id="error-msg"><span style="font-size:2rem">⚠️</span><span>Error al cargar la señal</span></div>
    <script>
        document.getElementById('back-btn').onclick = () => window.location.replace(HOME_URL);

        const params     = new URLSearchParams(window.location.search);
        let currentUrl   = params.get('url');
        const chanId     = params.get('id');
        const keys       = params.get('keys');      // clearKeys: JSON {kid: key}
        const licenseUrl = params.get('license');   // Widevine: URL del servidor de licencias
        let userAgent    = params.get('ua') || '';
        let referer      = params.get('referer') || '';
        let extraHeaders = params.get('headers') || '';

        let shakaPlayer = null;

        function proxyUrl(url) {
            const proxyParams = new URLSearchParams({ url });
            if (userAgent) proxyParams.set('ua', userAgent);
            if (referer) proxyParams.set('referer', referer);
            if (extraHeaders) proxyParams.set('headers', extraHeaders);
            return `/api/stream?${proxyParams.toString()}`;
        }

        function parseExtraHeaders() {
            try {
                const parsed = extraHeaders ? JSON.parse(extraHeaders) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch {
                return {};
            }
        }

        async function init() {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                document.getElementById('error-msg').classList.add('show');
                return;
            }
            const video = document.getElementById('video');
            shakaPlayer = new shaka.Player(video);

            const drmConfig = {};
            if (licenseUrl) {
                drmConfig.servers = { 'com.widevine.alpha': licenseUrl };
            } else if (keys) {
                try { drmConfig.clearKeys = JSON.parse(decodeURIComponent(keys)); }
                catch(e) { console.warn('DRM keys parse error:', e); }
            }

            shakaPlayer.configure({
                preferredAudioLanguage: 'es',
                preferredVariantRole: '',
                abr: { enabled: true },
                streaming: { rebufferingGoal: 2, bufferingGoal: 10, bufferBehind: 30 },
                drm: drmConfig
            });

            const networkingEngine = shakaPlayer.getNetworkingEngine();
            networkingEngine.registerRequestFilter((type, request) => {
                if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
                    Object.assign(request.headers, parseExtraHeaders());
                }
            });

            // Audio siempre en español, sin selector visible
            function forceSpanishAudio() {
                if (!shakaPlayer) return;
                try {
                    shakaPlayer.selectAudioLanguage('es');
                    const tracks = shakaPlayer.getVariantTracks() || [];
                    const esTracks = tracks.filter(t =>
                        (t.audioLanguage && t.audioLanguage.toLowerCase().startsWith('es')) ||
                        (t.language && t.language.toLowerCase().startsWith('es'))
                    );
                    if (esTracks.length) {
                        // Elegir la de mayor ancho de banda en español
                        esTracks.sort((a, b) => (b.bandwidth || 0) - (a.bandwidth || 0));
                        shakaPlayer.selectVariantTrack(esTracks[0], true);
                    }
                } catch(e) {}
            }

            shakaPlayer.addEventListener('error', (e) => {
                console.error('Shaka error:', e.detail);
                document.getElementById('error-msg').classList.add('show');
            });
            shakaPlayer.addEventListener('trackschanged', forceSpanishAudio);
            shakaPlayer.addEventListener('variantchanged', forceSpanishAudio);

            try {
                await loadWithFallback();
                video.play().catch(() => { video.muted = true; video.play(); });
                forceSpanishAudio();
            } catch(e) {
                console.error('Shaka load error:', e);
                document.getElementById('error-msg').classList.add('show');
            }
        }

        async function loadWithFallback() {
            const proxiedUrl = proxyUrl(currentUrl);
            const candidates = (userAgent || referer || extraHeaders)
                ? [proxiedUrl, currentUrl]
                : [currentUrl, proxiedUrl];
            let lastError = null;

            for (const playbackUrl of candidates) {
                try {
                    await shakaPlayer.unload();
                    document.getElementById('error-msg').classList.remove('show');
                    await shakaPlayer.load(playbackUrl);
                    console.info('MPD cargado usando', playbackUrl === currentUrl ? 'fuente directa' : 'proxy');
                    return;
                } catch (error) {
                    lastError = error;
                    console.warn('Falló la carga MPD, probando alternativa:', error);
                }
            }
            throw lastError || new Error('No se pudo cargar el MPD');
        }

        async function pollChanges() {
            if (!chanId) return;
            try {
                const res = await fetch(`datar.bin?v=${Date.now()}`, { cache: 'no-store' });
                const raw = await res.text();
                const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
                const canal = data.channels.find(c => c.id == chanId);
                const canalHeaders = canal?.headers && Object.keys(canal.headers).length
                    ? JSON.stringify(canal.headers)
                    : '';
                if (canal && (
                    canal.url !== currentUrl ||
                    (canal.ua || '') !== userAgent ||
                    (canal.referer || '') !== referer ||
                    canalHeaders !== extraHeaders
                )) {
                    const newParams = new URLSearchParams({ url: canal.url, id: chanId });
                    if (canal.ua) newParams.set('ua', canal.ua);
                    if (canal.referer) newParams.set('referer', canal.referer);
                    if (canal.headers && Object.keys(canal.headers).length) {
                        newParams.set('headers', JSON.stringify(canal.headers));
                    }
                    if (canal.drm_server) { newParams.set('license', canal.drm_server); }
                    else if (canal.drm_keys && Object.keys(canal.drm_keys).length) { newParams.set('keys', JSON.stringify(canal.drm_keys)); }
                    window.location.replace(`mpd.html?${newParams.toString()}`);
                }
            } catch(e) {}
        }

        if (currentUrl) { init(); setInterval(pollChanges, 10000); }
        else { document.getElementById('error-msg').classList.add('show'); }

        window.addEventListener('load', () => { setTimeout(() => document.getElementById('back-btn').focus(), 500); });
    </script>
</body>
</html>
