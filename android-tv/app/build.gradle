apply plugin: "com.android.application"

android {
    namespace "com.bartotv.tv"
    compileSdk 34

    defaultConfig {
        applicationId "com.bartotv.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0-native"
        // Token solo-lectura inyectado en el build desde el secret DATAR_TOKEN.
        // No commitear el valor: si está vacío, lee raw público.
        buildConfigField("String", "DATAR_TOKEN", "\"" + (System.getenv("DATAR_TOKEN") ?: "") + "\"")
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation("androidx.media3:media3-exoplayer:1.4.1")
    implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
    implementation("androidx.media3:media3-exoplayer-dash:1.4.1")
    implementation("androidx.media3:media3-ui:1.4.1")
    implementation("androidx.recyclerview:recyclerview:1.3.2")
}
