<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barto TV - Forza Unmute</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; width: 100%; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
        .back-btn:focus { outline: 3px solid #ffc107; transform: scale(1.2); background: rgba(255,193,7,0.3); }
        .back-btn {
            position: fixed; bottom: 12px; left: 12px; z-index: 1000;
            background: rgba(0,0,0,0.7); color: #fff; width: 50px; height: 50px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            text-decoration: none; border: 2px solid #ffc107; font-size: 1.3rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <script> const HOME_URL = new URL('./', window.location.href).href; </script>

    <button id="back-btn" class="back-btn" autofocus aria-label="Volver a la lista de canales">⬅</button>
    <div id="player"></div>

    <script>
        const backBtn = document.getElementById('back-btn');
        backBtn.onclick = () => window.location.replace(HOME_URL);

        // Focus permanente
        function keepFocus() { if (document.activeElement !== backBtn) backBtn.focus(); }
        window.addEventListener('load', () => setTimeout(keepFocus, 300));
        setInterval(() => {
            if (!document.activeElement || document.activeElement === document.body) keepFocus();
        }, 1000);

        const params  = new URLSearchParams(window.location.search);
        let currentId = params.get('source');
        const chanId  = params.get('id');

        var player;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: currentId,
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
            intentarForzarAudio();
            setTimeout(keepFocus, 400);
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PAUSED) {
                player.playVideo();
            }
        }

        function intentarForzarAudio() {
            let intentos = 0;
            const maxIntentos = 20;
            const forzador = setInterval(() => {
                if (player && typeof player.unMute === 'function') {
                    player.unMute();
                    player.setVolume(100);
                    if (!player.isMuted()) {
                        clearInterval(forzador);
                    }
                }
                intentos++;
                if (intentos >= maxIntentos) clearInterval(forzador);
            }, 500);
        }

                async function pollChanges() {
            if (!chanId) return;
            try {
                const res = await fetch(`datar.bin?v=${Date.now()}`, { cache: 'no-store' });
                const raw = await res.text();
                const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
                const canal = data.channels.find(c => c.id == chanId);
                if (canal) {
                    const newId = canal.url.includes('v=')
                        ? canal.url.split('v=')[1].split('&')[0]
                        : canal.url.split('/').pop();
                    if (newId !== currentId) {
                        currentId = newId;
                        if (player && typeof player.loadVideoById === 'function') {
                            player.loadVideoById(currentId);
                            player.playVideo();
                            intentarForzarAudio();
                        }
                    }
                }
            } catch(e) {}
        }

        setInterval(pollChanges, 10000);
    </script>
</body>
</html>
